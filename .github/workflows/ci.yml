name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Without this, every push to a PR
# branch queues another full build and the queue is worked through in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build extension
      run: npm run build

    - name: Vitest (TypeScript)
      run: npm run test

    - name: Python tests
      # NOTE: run from the REPOSITORY ROOT. The old step used
      # `working-directory: server` with paths like `tests/test_main.py`,
      # which resolved to server/tests/ - a directory that does not exist.
      # pytest errored "file or directory not found", ran 0 tests, and the
      # `|| true` made the step pass anyway, so the Python suite had never
      # actually run in CI. See issue #177.
      run: |
        python -m pip install -q -r server/requirements.txt
        python -m pytest tests/ -q

  lint:
    name: Lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    # All three now gate. They previously ran with `|| true`, so a red result
    # was printed and then discarded - a green checkmark on a step that
    # cannot fail.
    - name: TypeScript
      run: npx tsc --noEmit

    - name: ESLint
      run: npm run lint

    - name: Prettier
      run: npm run format:check

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Now BLOCKING, and green as of #178 (production tree) and #183 (full tree).
    #
    # It used to run `npm audit --production` and exit non-zero on any
    # high-severity finding from `sharp` (a transitive native image dep of
    # @huggingface/transformers). Those were fixed by an `overrides` entry
    # pinning sharp ^0.35.4, rather than the major @huggingface/transformers
    # upgrade npm's own --force suggested. `sharp` is a Node-native addon and
    # never reaches the browser bundle: a clean 23.92 MB production build
    # contains zero references to sharp, libvips or libheif.
    #
    # The 11 findings this step used to be scoped away from are now ZERO, and
    # not by upgrading `wxt` - every fix npm offered was a breaking major of
    # the build tool itself. They are cleared by `overrides` on the leaf
    # packages: tar ^7.5.22, shell-quote ^1.10.0, tmp ^0.2.7, uuid ^14.0.2,
    # adm-zip ^0.6.1 - the same lever #178 used for `sharp`. Four of the
    # eleven (`giget`, `fx-runner`, `web-ext-run`, `firefox-profile`) are
    # wxt's own pinned ranges and clear transitively from those leaf fixes.
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    # FULL tree, not the production subset: 0 findings as of #183.
    #
    # Scoping this to the production subset is what let the #183 findings sit
    # unnoticed, and it would not even have caught `sharp` - which is
    # transitive to a PRODUCTION package via @huggingface/transformers.
    - name: npm audit (full tree)
      run: npm audit

    - name: Python safety
      run: |
        python -m pip install -q safety
        safety check -r server/requirements.txt
