name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --ignore-scripts || npm install
    
    - name: Build extension
      run: npm run build
      env:
        NODE_ENV: production
    
    - name: Run tests
      run: npm test -- --run || true
    
    - name: Run Python tests (optional)
      run: |
        pip install -r server/requirements.txt || true
        python -m pytest tests/ || true
      working-directory: server

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Install dependencies
      run: npm ci --ignore-scripts || npm install
    
    - name: Run TypeScript check (non-blocking)
      run: npx tsc --noEmit || true
    
    - name: Run Python linting (non-blocking)
      run: |
        pip install flake8 || true
        flake8 server/ --max-line-length=120 || true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Install dependencies
      run: npm ci --ignore-scripts || npm install
    
    - name: Run npm audit (informational)
      run: npm audit --production || true
    
    - name: Run Python security check (informational)
      run: |
        pip install safety || true
        safety check -r server/requirements.txt || true
