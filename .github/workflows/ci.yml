name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Without this, every push to a PR
# branch queues another full build and the queue is worked through in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build extension
      run: npm run build

    - name: Vitest (TypeScript)
      run: npm run test

    - name: Python tests
      # NOTE: run from the REPOSITORY ROOT. The old step used
      # `working-directory: server` with paths like `tests/test_main.py`,
      # which resolved to server/tests/ - a directory that does not exist.
      # pytest errored "file or directory not found", ran 0 tests, and the
      # `|| true` made the step pass anyway, so the Python suite had never
      # actually run in CI. See issue #177.
      run: |
        python -m pip install -q -r server/requirements.txt
        python -m pytest tests/ -q

  lint:
    name: Lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    # All three now gate. They previously ran with `|| true`, so a red result
    # was printed and then discarded - a green checkmark on a step that
    # cannot fail.
    - name: TypeScript
      run: npx tsc --noEmit

    - name: ESLint
      run: npm run lint

    - name: Prettier
      run: npm run format:check

  security:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only - this job must never turn a green push red. `npm audit` is
    # noisy on dev dependencies, and the 2 high-severity production findings are
    # tracked in issue #178 rather than fixed here: `npm audit fix --force` wants
    # major-version bumps that can break the WXT build.
    #
    # It previously ran `npm audit --production` as-is, which exits non-zero on
    # ANY finding. Even with continue-on-error, GitHub still painted a red X and a
    # "Some checks were not successful" banner over the commit - which reads as a
    # failed push to anyone who is not looking at the job matrix (issue #182).
    # The findings are still reported, now as a job-summary warning instead of a
    # failing check. Promote this job to required once #178 is resolved.
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    # Never fails the job: report the counts, surface them in the run summary,
    # and exit 0 whatever `npm audit` returns.
    - name: npm audit (production, advisory)
      run: |
        set +e
        npm audit --production --json > audit.json
        rc=$?
        set -e

        counts=$(jq -r '.metadata.vulnerabilities
          | "critical=\(.critical) high=\(.high) moderate=\(.moderate) low=\(.low) total=\(.total)"' audit.json)
        total=$(jq -r '.metadata.vulnerabilities.total' audit.json)

        {
          echo "### Dependency audit (advisory)"
          echo ""
          echo "Production dependencies: \`$counts\`"
          echo ""
          echo "<details><summary>npm audit output</summary>"
          echo ""
          echo '```'
          npm audit --production || true
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$total" -gt 0 ]; then
          echo "::warning title=Dependency audit::${counts} in production dependencies (tracked in #178, advisory - does not block)"
        else
          echo "::notice title=Dependency audit::No production dependency findings."
        fi

        # Deliberately always 0 - this job reports, it does not gate.
        echo "npm audit exit code was $rc; advisory step is non-blocking by design."
        exit 0

    - name: Python safety
      run: |
        set +e
        python -m pip install -q safety
        safety check -r server/requirements.txt
        rc=$?
        set -e
        echo "safety exit code was $rc; advisory step is non-blocking by design."
        exit 0
