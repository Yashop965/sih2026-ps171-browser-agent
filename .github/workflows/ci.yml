name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Install dependencies
      run: npm install
    
    - name: Build extension
      run: npm run build
    
    - name: Run tests
      run: npm run test
    
    - name: Run Python tests (optional)
      run: |
        pip install -r server/requirements.txt
        python -m pytest tests/test_main.py tests/test_fastapi_planner.py -v || true
      working-directory: server
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Install dependencies
      run: npm install
    
    - name: Run TypeScript check (non-blocking)
      run: npx tsc --noEmit || true
    
    - name: Run Python linting (non-blocking)
      run: |
        pip install flake8
        flake8 server/ --max-line-length=120 || true
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Install dependencies
      run: npm install
    
    - name: Run npm audit (informational)
      run: npm audit --production || true
    
    - name: Run Python security check (informational)
      run: |
        pip install safety
        safety check -r server/requirements.txt || true
      continue-on-error: true
